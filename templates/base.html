<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Panel{% endblock %} - {{ bot_name }}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f1117;
            color: #e1e4e8;
            min-height: 100vh;
        }
        .sidebar {
            position: fixed;
            top: 0; left: 0;
            width: 240px;
            height: 100vh;
            background: #161b22;
            border-right: 1px solid #30363d;
            padding: 20px 0;
            overflow-y: auto;
        }
        .sidebar h2 {
            padding: 0 20px 20px;
            font-size: 18px;
            color: #58a6ff;
            border-bottom: 1px solid #30363d;
        }
        .sidebar a {
            display: block;
            padding: 12px 20px;
            color: #8b949e;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.2s;
        }
        .sidebar a:hover, .sidebar a.active {
            background: #21262d;
            color: #e1e4e8;
            border-left: 3px solid #58a6ff;
        }
        .sidebar .logout {
            position: absolute;
            bottom: 20px;
            width: 100%;
            border-top: 1px solid #30363d;
            padding-top: 10px;
        }
        .main {
            margin-left: 240px;
            padding: 30px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .header h1 { font-size: 24px; color: #f0f6fc; }
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
        }
        .card h3 {
            font-size: 13px;
            color: #8b949e;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .card .value {
            font-size: 28px;
            font-weight: 700;
            color: #f0f6fc;
        }
        .card .value.green { color: #3fb950; }
        .card .value.blue { color: #58a6ff; }
        .card .value.yellow { color: #d29922; }
        .card .value.red { color: #f85149; }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #21262d;
            font-size: 14px;
        }
        th {
            background: #0d1117;
            color: #8b949e;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 12px;
        }
        tr:hover { background: #21262d; }
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge.green { background: #1b3a26; color: #3fb950; }
        .badge.red { background: #3d1b1b; color: #f85149; }
        .badge.yellow { background: #3d331b; color: #d29922; }
        .badge.blue { background: #1b2d3d; color: #58a6ff; }
        .btn {
            display: inline-block;
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
        }
        .btn.green { background: #238636; color: #fff; }
        .btn.red { background: #da3633; color: #fff; }
        .btn.blue { background: #1f6feb; color: #fff; }
        .btn:hover { opacity: 0.85; }
        .btn.small { padding: 4px 10px; font-size: 12px; }
        .flash {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .flash.success { background: #1b3a26; color: #3fb950; border: 1px solid #238636; }
        .flash.error { background: #3d1b1b; color: #f85149; border: 1px solid #da3633; }
        .flash.info { background: #1b2d3d; color: #58a6ff; border: 1px solid #1f6feb; }
        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .search-bar input {
            flex: 1;
            padding: 10px 14px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #e1e4e8;
            font-size: 14px;
        }
        .search-bar input:focus { outline: none; border-color: #58a6ff; }
        textarea {
            width: 100%;
            min-height: 150px;
            padding: 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #e1e4e8;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
        }
        textarea:focus { outline: none; border-color: #58a6ff; }
        .inline-form { display: inline; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>⚡ {{ bot_name }}</h2>
        <a href="{{ url_for('dashboard') }}" class="{% if request.endpoint == 'dashboard' %}active{% endif %}">📊 Dashboard</a>
        <a href="{{ url_for('users') }}" class="{% if request.endpoint == 'users' %}active{% endif %}">👥 Users</a>
        <a href="{{ url_for('orders') }}" class="{% if request.endpoint == 'orders' %}active{% endif %}">📦 Orders</a>
        <a href="{{ url_for('products_list') }}" class="{% if request.endpoint == 'products_list' %}active{% endif %}">🏷️ Products</a>
        <a href="{{ url_for('topups') }}" class="{% if request.endpoint == 'topups' %}active{% endif %}">💰 Topups</a>
        <a href="{{ url_for('broadcast') }}" class="{% if request.endpoint == 'broadcast' %}active{% endif %}">📢 Broadcast</a>
        <div class="logout">
            <a href="{{ url_for('logout') }}">🚪 Logout</a>
        </div>
    </div>

    <div class="main">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
